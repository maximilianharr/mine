<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com">
<title>Calendar</title>
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1f2933">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="needs-setup" hidden>
  <header><h1>Calendar</h1><a class="icon-btn" href="../">✕</a></header>
  <p class="lede">Mine is not set up on this device yet.</p>
  <p><a href="../">Open Mine</a> and enter the repo and token once; the calendar then uses them.</p>
</section>

<main id="cal" hidden>
  <div class="topbar">
    <!-- leftmost: the way to the other kind of view, and the filter -->
    <div class="tb-side">
      <button id="board" class="nav ic" aria-label="Kanban"></button>
      <button id="filter-btn" class="nav ic" aria-label="Filter" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 3h12l-4.8 5.8V14L6.8 12.6V8.8z"/></svg></button>
    </div>
    <!-- centred: the period. The label zooms, the caret opens the picker. -->
    <div class="tb-mid">
      <button id="prev" class="nav" aria-label="Previous">‹</button>
      <button id="period" class="period" aria-label="Zoom"><span id="period-label">—</span></button>
      <button id="caret" class="nav caret" aria-label="Pick a date" aria-haspopup="true" aria-expanded="false">▾</button>
      <button id="next" class="nav" aria-label="Next">›</button>
    </div>
    <!-- rightmost: the two ways out -->
    <div class="tb-side end">
      <button id="gear" class="nav" aria-label="Settings">⚙</button>
      <a class="nav ic" id="home" href="../" aria-label="Back to Mine"></a>
    </div>
  </div>

  <div class="view" id="view"></div>
  <p class="sync" id="sync"></p>
</main>

<!-- dropdown date picker: a month at a time, a 9-year grid, or a list of sprints -->
<div class="pop" id="picker" hidden>
  <div class="pop-head">
    <button id="pick-title" class="pop-title" type="button"><span id="pick-label">—</span></button>
    <span class="spacer"></span>
    <button id="pick-prev" class="nav" type="button" aria-label="Previous">‹</button>
    <button id="pick-next" class="nav" type="button" aria-label="Next">›</button>
  </div>
  <div class="pick-body" id="pick-body"></div>
</div>

<!-- view filter: groups always, priority and assignee on the board -->
<div class="pop" id="filter-pop" hidden>
  <div id="filter-body"></div>
</div>

<!-- the day preview: a list on desktop, a sheet on a phone -->
<div class="pop" id="day-pop" hidden>
  <div class="pop-head">
    <strong id="day-title">—</strong><span class="spacer"></span>
    <button class="ib" id="day-add" type="button" title="Add an entry on this day" aria-label="Add an entry on this day"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M8 3v10M3 8h10"/></svg></button>
    <button class="ib" id="day-close" type="button" title="Close" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div id="day-list" class="day-list"></div>
</div>

<!-- the entry popup. The icon row and the detail rows are built in app code. -->
<div class="modal" id="popup" hidden>
  <form class="card" id="entry-form" autocomplete="off">
    <div class="iconbar" id="f-icons"></div>

    <input class="title-in" id="f-title" name="title" placeholder="Title" required>

    <div class="scope" id="f-scope" hidden>
      <span class="scope-note">Part of a repeating entry.</span>
      <div class="btngroup" role="radiogroup" aria-label="Edit scope">
        <button type="button" class="seg" data-scope="occurrence">This occurrence</button>
        <button type="button" class="seg" data-scope="series">Whole series</button>
      </div>
      <button type="button" class="link" id="f-skip" hidden>skip this one</button>
    </div>

    <div class="row2">
      <label>Start <input type="date" id="f-start-date" required></label>
      <label class="t">Time <input type="time" id="f-start-time"></label>
    </div>
    <div class="row2">
      <label>End <input type="date" id="f-end-date"></label>
      <label class="t">Time <input type="time" id="f-end-time"></label>
    </div>

    <!-- the toggle row, under start and end: all-day, and on a task stage, priority, estimate -->
    <div class="iconbar flags" id="f-flags"></div>

    <div class="frows" id="f-rows"></div>
    <p class="msg" id="f-msg"></p>
    <p class="path" id="f-path"></p>
  </form>
</div>

<!-- one field at a time, above the entry popup. Nothing here reaches the repo. -->
<div class="pop sub" id="sub" hidden>
  <div class="pop-head">
    <strong id="sub-title">—</strong><span class="spacer"></span>
    <button class="ib bad" id="sub-clear" type="button" title="Clear this field" aria-label="Clear this field"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.2 1.6h3.6l.6 1.2h2.8v1.5H2.8V2.8h2.8l.6-1.2zM3.9 5.6h8.2l-.7 8.8H4.6z"/></svg></button>
    <button class="ib" id="sub-cancel" type="button" title="Abandon this edit" aria-label="Abandon this edit"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 4l8 8M12 4l-8 8"/></svg></button>
    <button class="ib save" id="sub-ok" type="button" title="Use this value" aria-label="Use this value"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.6 2h8.2L14 5.2V14H2.6zm3 0v3.6h4.6V2zM5 9h6v5H5z"/></svg></button>
  </div>
  <div id="sub-body"></div>
</div>

<div class="sheet panel" id="settings-sheet" hidden>
  <div class="pop-head">
    <h2>Calendar settings</h2><span class="spacer"></span>
    <button class="ib" id="settings-close" type="button" title="Close" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div id="settings-body"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="scrim sub-scrim" id="sub-scrim" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
